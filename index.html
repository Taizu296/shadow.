<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >
  <title>Shadow Hunters</title>
  <link rel="stylesheet" href="style.css?v=16">
</head>

<body>

<div id="game">
  
  <div id="hud">
    <div class="title">SHADOW HUNTERS</div>

    <div class="stats">
      ❤️ <span id="hp">100</span>
      &nbsp;&nbsp;
      ☠️ <span id="kills">0</span>
    </div>

    <div class="level">
  WAVE <span id="wave">1</span>
  &nbsp;•&nbsp;
  <span id="waveTimer">30</span>s
  &nbsp;•&nbsp;
  LV. <span id="level">1</span>
</div>

<div class="score">
  SCORE <span id="score">0</span>
  &nbsp;•&nbsp;
  BEST <span id="highscore">0</span>
</div>

    <div class="xpbar">
      <div id="xpfill"></div>
    </div>
  </div>
  
  <div id="world">

  <div id="player">
    <div class="playerAura"></div>
    <div class="mage">🔮</div>
  </div>
  
  </div>

<div id="joystick">
  <div id="joystickKnob"></div>
</div>

<div id="levelUp">
  <div class="levelUpBox">
    <div class="levelUpTitle">LEVEL UP</div>
    <div class="levelUpSubtitle">Wähle ein Upgrade</div>

    <div id="upgradeChoices"></div>
  </div>
</div>

  <div id="gameOver">
  <h1>GAME OVER</h1>

  <p>Score: <span id="finalScore">0</span></p>
  <p>Best: <span id="finalHighscore">0</span></p>
  <p>Wave: <span id="finalWave">1</span></p>
  <p>Kills: <span id="finalKills">0</span></p>

  <button onclick="location.reload()">NEUSTART</button>
</div>

</div>

<script src="game.js?v=16"></script>

</body>
</html>
